# 테스트 전용 설정. classpath:/config/application.yml은 main의 application.yml 위에 덮인다.
# 통합 테스트는 모두 같은 IP(127.0.0.1)에서 참가자를 많이 만들고 분석을 많이 내므로 IP 한도를 사실상 끈다.
# 한도 자체는 ClientRateLimitApiTest가 낮은 값으로 따로 확인한다.
santacut:
  rate-limit:
    registrations-per-client: 1000000
    submissions-per-client: 1000000
  # 순위 다시 계산은 테스트가 RankingRebuildFacade를 직접 부른다. 예약 작업이 테스트 도중 끼어들지 않게 간격을 길게 잡고,
  # 커밋 직후 다시 계산도 끈다. 커밋 직후 다시 계산은 RankingRebuildAfterCommitTest가 켜서 따로 확인한다.
  ranking:
    rebuild-delay-ms: 3600000
    rebuild-after-change: false
  # 조서 테스트는 실제 콘텐츠 문구에 기대지 않도록 작은 픽스처 리소스를 읽는다. 실제 리소스는 DossierResourcesTest가 따로 검사한다.
  dossier:
    resource-location: classpath:dossier-fixture/
  # 팩폭 작가는 기본으로 끈다(대체 문장만 쓴다). 작가 흐름은 RoastClient를 목으로 바꾼 테스트가 따로 확인한다.
  ai:
    roast:
      model: ""
# 조회 수 테스트(QueryCountTest)가 요청 하나에 SQL을 몇 번 준비하는지 센다. 테스트에서만 켠다.
spring:
  jpa:
    properties:
      hibernate.generate_statistics: true
