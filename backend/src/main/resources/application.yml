spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./data/santacut.db}
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      mode: always
      # 서울 밖 시·도와 시·군·구 시드. schema.sql 다음에 매번 실행되며 INSERT OR IGNORE라 기존 DB에도 새 지역만 더한다.
      data-locations: classpath:regions.sql
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
server:
  shutdown: graceful
  forward-headers-strategy: none
  tomcat:
    threads:
      max: 40
    # 20MB를 넘는 업로드를 거절한 뒤에도 연결을 끊지 않고 남은 본문을 읽어 413 응답을 보낸다.
    max-swallow-size: 21MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  session-secure: ${APP_SESSION_SECURE:false}
  season-year: ${APP_SEASON_YEAR:2026}
  origin-lat: ${SANTA_ORIGIN_LAT:37.5252}
  origin-lon: ${SANTA_ORIGIN_LON:126.9253}
spring.ai:
  model.chat: bedrock-converse
  bedrock:
    aws:
      # 자격 증명은 AWS 기본 체인(AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY 환경 변수)에서 읽는다.
      region: ${AWS_REGION:ap-northeast-2}
    converse.chat:
      # 앱 IAM 사용자는 global. 추론 프로파일로만 호출할 수 있다.
      model: ${BEDROCK_MODEL_ID:global.anthropic.claude-haiku-4-5-20251001-v1:0}
      temperature: 0.1
      max-tokens: 500
