spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./data/santacut.db}
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      mode: always
      # Hibernate가 테이블을 만든 다음 매번 실행되는 시드. 모두 IF NOT EXISTS나 INSERT OR IGNORE라 기존 DB에는 없는 것만 더한다.
      # seed.sql: 유일 인덱스, 순위 계산 요청 행, 서울 지역. regions.sql: 서울 밖 시·도와 시·군·구.
      # prompts.sql: 채점 프롬프트(score)와 팩폭 작가 프롬프트(roast) 1판부터 최신 판까지. 테이블은 schema.sql 없이 엔티티로만 만든다.
      data-locations: classpath:seed.sql,classpath:regions.sql,classpath:prompts.sql
  jpa:
    hibernate:
      ddl-auto: update
    # enum 컬럼에 상수 목록 CHECK를 붙이지 않는 SQLite 방언이다. 이유는 클래스 주석에 있다.
    database-platform: com.santacut.infrastructure.global.config.EnumCheckFreeSQLiteDialect
    open-in-view: false
    # 시드 SQL을 Hibernate가 테이블을 만든 뒤에 실행한다(빈 DB에서도 테이블이 먼저 있어야 한다).
    defer-datasource-initialization: true
    # 순위 계산은 참가자 수만큼 스냅숏을 새로 쓴다. INSERT를 묶어 보내 하나뿐인 DB 연결을 오래 쥐지 않게 한다.
    properties:
      hibernate.jdbc.batch_size: 500
      hibernate.order_inserts: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
server:
  shutdown: graceful
  forward-headers-strategy: none
  tomcat:
    threads:
      max: 40
    # 20MB를 넘는 업로드를 거절한 뒤에도 연결을 끊지 않고 남은 본문을 읽어 413 응답을 보낸다.
    max-swallow-size: 21MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
santacut:
  # 「2026 산타 조서」 리소스(입버릇·주제·따뜻한 말·욕설·위기어 사전, 극값 기준표, 문구 템플릿). 앱이 뜰 때 읽어 검사한다.
  dossier:
    resource-location: classpath:dossier/
  # dev 전용 프롬프트 관리 API(/v1/admin/prompts). 운영은 끈 채로 둔다(404).
  # 켜도 관리 토큰(PROMPT_ADMIN_TOKEN)이 없으면 뜨지 않는다. 요청은 X-Admin-Token 헤더에 이 토큰을 실어야 한다.
  prompt-admin:
    enabled: ${PROMPT_ADMIN_ENABLED:false}
    token: ${PROMPT_ADMIN_TOKEN:}
  # 앱 안의 AI 비용 가드. 기록한 토큰 수 × 단가로 한 달(설정하면 하루도) 비용을 어림해 한도에 닿으면 작업을 잡지 않는다.
  # Gemini는 선불 크레딧으로 쓰므로 하루 한도는 기본으로 끈다(0). 크레딧이 떨어지면 Gemini가 429로 막고 작업자는 잠시 멈춘다.
  # 항목 점수 수축 x' = (C·m + w·x) / (C + w). m은 중립 점수(55, 코드 상수), C와 본인 턴 기준은 평가로 골랐다(backend-design.md §14.10).
  score.shrinkage:
    strength: 0.25
    full-self-turns: 5
    personal-prior: true
  # 짧은 대화(한 구간)를 몇 번 따로 채점해 항목별 중앙값을 낼지. 1이면 예전처럼 한 번만 묻는다(backend-design.md).
  # 긴 대화(여러 구간)는 첫 구간을 먼저 부르고(뒤 호출이 시스템 프롬프트 캐시를 타게) 나머지를 chunk-concurrency개씩 동시에 부른다.
  score.sampling:
    samples: 3
    chunk-concurrency: 4
    # 모든 작업자를 합쳐 동시에 진행하는 채점 호출 수 상한. 작업자 수(3)보다 작게 두지 않는다.
    max-concurrent-calls: 6
  # 아래 단가는 채점 모델(3.5 Flash-Lite) 것이다. 작가 모델 단가는 santacut.ai.roast.*에 따로 있다.
  ai.budget:
    daily-usd: ${AI_BUDGET_DAILY_USD:0}
    monthly-usd: ${AI_BUDGET_MONTHLY_USD:9}
    input-usd-per-million-tokens: 0.3
    # 암묵적 캐시에서 읽은 입력 토큰 단가. 3.5 Flash-Lite 공식 단가표(context caching)의 값이다.
    cached-input-usd-per-million-tokens: 0.03
    output-usd-per-million-tokens: 2.5
    # 제공자가 호출을 막았거나(권한, 요청 한도) 연달아 3번 실패하면 이만큼 작업 잡기를 멈춘다.
    pause: 15m
    max-consecutive-failures: 3
  # 「팩폭 산타」 작가 호출(채점 뒤 한 번, 검증에 떨어진 필드만 최대 max-rewrites번 다시). 채점 모델 설정과 따로 둔다.
  # ROAST_MODEL을 비우면 작가를 부르지 않고 서버 대체 문장만 쓴다. 작가가 실패해도 채점 결과는 정상 저장된다.
  # 생각 토큰이 출력 한도를 함께 써서 응답이 잘렸던 실측이 있어 출력 한도를 넉넉히 둔다. 작업 리스는 작가 호출 수만큼 늘어난다.
  ai.roast:
    model: ${ROAST_MODEL:gemini-3.5-flash}
    temperature: 1.0
    max-output-tokens: 8192
    thinking-level: LOW
    call-timeout: 60s
    max-rewrites: 1
    # 호출 전 비용 예약에 쓰는 호출 한 번의 어림 출력 토큰 수(스키마 글자 수 상한 합 + 여유). 실제 사용량은 응답 메타데이터로 기록한다.
    estimated-output-tokens: 1500
    # 작가 호출 비용은 채점 단가(santacut.ai.budget.*)가 아니라 이 단가로 센다. Gemini 3.5 Flash 표준 등급 정가(2026-11-20 확인)다.
    # 생각 토큰은 출력 단가로 청구된다. 호출 전 예약은 (입력 어림 + 출력 상한) × 최대 호출 수로 잡는다.
    input-usd-per-million-tokens: 1.5
    cached-input-usd-per-million-tokens: 0.15
    output-usd-per-million-tokens: 9
    thinking-usd-per-million-tokens: 9
  # 동시에 채점하는 분석 작업 수. 작업 하나가 Gemini를 한 구간 대화는 3번 동시에, 긴 대화는 첫 구간 뒤 최대 4구간씩 동시에 부른다(backend-design.md).
  ai.worker:
    concurrency: ${ANALYSIS_WORKER_CONCURRENCY:3}
  # 순위 계산(backend-design.md §7.5). 변경은 요청 표시만 남기고, 커밋되면 rebuild-debounce(지난 계산 뒤 rebuild-min-interval이 안 됐으면 남은 시간)만큼 기다려 그 사이 요청을 모아 한 번 다시 계산한다.
  # rebuild-delay-ms마다 도는 예약 작업은 커밋 뒤 예약을 놓친 요청(앱 재시작, 계산 실패)을 처리하는 안전망이다.
  # 첫 페이지 순위표는 first-page-ttl 동안 메모리에 두고, 도착 예정 시각은 12월 25일부터 delivery-window-days일(하루 6시간) 안에 맞춘다.
  ranking:
    rebuild-delay-ms: ${RANKING_REBUILD_DELAY_MS:30000}
    rebuild-after-change: true
    rebuild-debounce: 1s
    # 지난 계산이 끝난 뒤 이만큼은 다시 계산하지 않는다. 작업이 몰려도 계산(참가자 수만큼 행 쓰기)이 이보다 잦지 않다.
    rebuild-min-interval: 5s
    first-page-ttl: 30s
    delivery-window-days: 7
  # 참가자별 지역 변경 한도. 넘으면 429(REGION_CHANGE_LIMITED는 retry_at 있음, REGION_CHANGE_SEASON_LIMIT은 없음).
  region-change:
    max-per-window: 2
    window: 24h
    max-per-season: 5
  # 진행 상황 스트림(SSE)의 앱 전체 상한. 넘으면 503(ANALYSIS_STREAM_LIMIT)이고 화면은 폴링으로 바꾼다.
  stream:
    max-open-streams: 200
    retry-after: 30s
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  session-secure: ${APP_SESSION_SECURE:false}
  # 세션·CSRF 쿠키의 SameSite. 다른 사이트(예: localhost)의 프론트엔드가 부르게 하려면 None과 Secure를 함께 쓴다.
  session-same-site: ${APP_SESSION_SAME_SITE:Lax}
  season-year: ${APP_SEASON_YEAR:2026}
  origin-lat: ${SANTA_ORIGIN_LAT:37.5252}
  origin-lon: ${SANTA_ORIGIN_LON:126.9253}
  cors:
    # 쿠키를 실어 API를 부를 수 있는 프론트엔드 출처. 쉼표로 나눈다.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://www.santacut.me,https://santacut.me}
spring.ai:
  model.chat: google-genai
  google.genai:
    # Gemini Developer API 키. 환경 변수로만 넣는다. 시간 상한(60초)과 재시도 끔은 GeminiClientConfiguration이 정한다.
    api-key: ${GEMINI_API_KEY:}
    chat:
      # 채점 모델. GEMINI_MODEL로 바꿀 수 있고, 비우면 AI 분석을 끈다.
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      temperature: 0.1
      # 정상 답(근거 항목당 1~3개)은 100토큰 안팎이다. 폭주해도 비용이 크지 않게 낮게 둔다.
      max-output-tokens: 250
      # 3.5 Flash-Lite는 생각(thinking)을 끌 수 없고 기본 수준이 MINIMAL이다. 기본값이 바뀌어도 그대로이도록 수준을 적어 둔다.
      # thinking-budget은 이 모델이 400으로 거절하므로 쓰지 않는다. 생각 토큰은 출력 단가로 청구되고 max-output-tokens를 함께 쓴다.
      thinking-level: MINIMAL
      response-mime-type: application/json
---
# 운영에서는 같은 compose 네트워크의 Caddy가 TLS를 끝내고 X-Forwarded-For·X-Forwarded-Proto를 붙인다.
# 이 헤더를 읽어야 요청이 https로 보이고 Swagger "Servers"가 https 주소가 된다(http로 부르면 Caddy가 308로 돌려 POST가 깨진다).
# 앱 포트는 compose에서 127.0.0.1에만 열려 있다. 헤더는 루프백과 Docker 브리지 대역(172.16.0.0/12)에서 온 요청만 믿는다.
spring.config.activate.on-profile: production
# 운영 프로필은 HTTPS 뒤에서만 돈다. 세션·CSRF 쿠키가 Secure가 아니면 앱이 뜨지 않는다(SessionCookieProperties).
app:
  session-secure: ${APP_SESSION_SECURE:true}
  require-secure-session: true
# Swagger UI와 OpenAPI 명세는 운영에서 끈다. dev는 app.env에 SWAGGER_ENABLED=true를 둬 켠다.
springdoc:
  api-docs.enabled: ${SWAGGER_ENABLED:false}
  swagger-ui.enabled: ${SWAGGER_ENABLED:false}
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1'
