spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./data/santacut.db}
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      mode: always
      # schema.sql 다음에 매번 실행되는 시드. 둘 다 INSERT OR IGNORE라 기존 DB에는 없는 행만 더한다.
      # regions.sql: 서울 밖 시·도와 시·군·구, prompts.sql: 채점 프롬프트(score) 1판과 2판.
      data-locations: classpath:regions.sql,classpath:prompts.sql
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
server:
  shutdown: graceful
  forward-headers-strategy: none
  tomcat:
    threads:
      max: 40
    # 20MB를 넘는 업로드를 거절한 뒤에도 연결을 끊지 않고 남은 본문을 읽어 413 응답을 보낸다.
    max-swallow-size: 21MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
santacut:
  # dev 전용 프롬프트 관리 API(/v1/admin/prompts). 운영은 끈 채로 둔다(404).
  prompt-admin.enabled: ${PROMPT_ADMIN_ENABLED:false}
  # 앱 안의 AI 비용 가드. 기록한 토큰 수 × 단가로 하루·한 달 비용을 어림해 한도에 닿으면 작업을 잡지 않는다.
  ai.budget:
    daily-usd: ${AI_BUDGET_DAILY_USD:0.5}
    monthly-usd: ${AI_BUDGET_MONTHLY_USD:9}
    input-usd-per-million-tokens: 1
    output-usd-per-million-tokens: 5
    # 제공자가 호출을 막았거나(권한, 요청 한도) 연달아 3번 실패하면 이만큼 작업 잡기를 멈춘다.
    pause: 15m
    max-consecutive-failures: 3
  # 진행 상황 스트림(SSE)의 앱 전체 상한. 넘으면 503(ANALYSIS_STREAM_LIMIT)이고 화면은 폴링으로 바꾼다.
  stream:
    max-open-streams: 200
    retry-after: 30s
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  session-secure: ${APP_SESSION_SECURE:false}
  season-year: ${APP_SEASON_YEAR:2026}
  origin-lat: ${SANTA_ORIGIN_LAT:37.5252}
  origin-lon: ${SANTA_ORIGIN_LON:126.9253}
spring.ai:
  model.chat: google-genai
  google.genai:
    # Gemini Developer API 키. 환경 변수로만 넣는다. 시간 상한(60초)과 재시도 끔은 GeminiClientConfiguration이 정한다.
    api-key: ${GEMINI_API_KEY:}
    chat:
      model: gemini-2.5-flash
      temperature: 0.1
      # 정상 답(근거 항목당 1~3개)은 100토큰 안팎이다. 폭주해도 비용이 크지 않게 낮게 둔다.
      max-output-tokens: 250
      # 생각(thinking) 토큰은 출력 단가로 매겨지므로 꺼서 비용을 예측할 수 있게 한다.
      thinking-budget: 0
      response-mime-type: application/json
