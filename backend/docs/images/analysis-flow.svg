<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="분석 흐름: 1 분석 제출, 2 접수 검사, 3 저장하고 202, 4 원본 꺼내기, 5 파싱과 정규화, 6 대기열로, 7 작업 임대, 8 최신 프롬프트 판으로 Gemini 3.5 Flash-Lite 채점, 9 평가 저장과 순위 재계산을 한 트랜잭션으로. 클라이언트는 VALIDATING부터 SUCCEEDED까지 폴링한다">
  <title>분석 흐름: 1 분석 제출, 2 접수 검사, 3 저장하고 202, 4 원본 꺼내기, 5 파싱과 정규화, 6 대기열로, 7 작업 임대, 8 최신 프롬프트 판으로 Gemini 3.5 Flash-Lite 채점, 9 평가 저장과 순위 재계산을 한 트랜잭션으로. 클라이언트는 VALIDATING부터 SUCCEEDED까지 폴링한다</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1B2E"/><stop offset="0.62" stop-color="#0B1D2D"/><stop offset="1" stop-color="#0B2422"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4C4D8"/>
    </marker>
    <marker id="arrLater" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8DA3BE"/>
    </marker>
    <symbol id="flake" viewBox="-10 -10 20 20" overflow="visible"><g fill="none" stroke-width="1.3" stroke-linecap="round"><g transform="rotate(0)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g><g transform="rotate(60)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g><g transform="rotate(120)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g></g></symbol>
    
    <style>
      text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', system-ui, sans-serif; }
      text:not([fill]) { fill: #F5F8FC; }
      .card { fill: #12263F; stroke: #1E3A5C; stroke-width: 1.5; }
      .inner { fill: #183152; stroke: #2B4A70; stroke-width: 1; }
      .ghost { fill: #0C1B2E; stroke: #8DA3BE; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .dev { fill: #0E3328; stroke: #134236; stroke-width: 1.5; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 14px; fill: #B4C4D8; }
      .code { font-family: ui-monospace, 'SF Mono', 'D2Coding', Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #8ECDF5; }
      .line { stroke: #B4C4D8; stroke-width: 2; fill: none; }
      .later { stroke: #8DA3BE; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
      
    </style>
  </defs>
  <rect width="1200" height="860" rx="24" fill="url(#bg)"/>
  <path d="M0,836 Q300,820 600,832 T1200,830 V836 A24,24 0 0 1 1176,860 H24 A24,24 0 0 1 0,836 z" fill="#F5F8FC" opacity="0.05"/>
  <g fill="#F5F8FC"><circle cx="370" cy="566" r="1.5" opacity="0.46"/><circle cx="291" cy="200" r="0.9" opacity="0.31"/><circle cx="883" cy="119" r="1.3" opacity="0.3"/><circle cx="408" cy="362" r="1.6" opacity="0.4"/><circle cx="106" cy="236" r="0.9" opacity="0.47"/><circle cx="965" cy="664" r="1.6" opacity="0.44"/></g>
  <path d="M40,0 H64 V56 L52,47 L40,56 z" fill="#B5123E"/>
  <path d="M43.5,0 V50 M60.5,0 V50" stroke="#E9B949" stroke-width="1" opacity="0.75"/>
  <text x="82" y="48" font-size="28" font-weight="800">분석 흐름</text>
  <text x="1160" y="48" text-anchor="end" font-size="16" fill="#B4C4D8">요청은 바로 202로 끝난다. 검증과 채점은 작업자가 한다</text><use href="#flake" xlink:href="#flake" x="1150" y="812" width="16" height="16" stroke="#F5F8FC" opacity="0.35"/><rect class="card" x="40" y="84" width="1120" height="168" rx="18"/><text x="64" y="120" class="h">요청 스레드</text><rect class="inner" x="220" y="100" width="300" height="136" rx="14"/><circle cx="246" cy="128" r="13" fill="#E9B949"/><text x="246" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#08121F">1</text><text x="268" y="134" class="h">분석 제출</text><text x="240" y="168" class="code">POST /v1/analyses/files</text><text x="240" y="192" class="code">POST /v1/analyses</text><text x="240" y="216" class="s">Idempotency-Key, CSRF</text><path class="line" d="M520,168 H534" marker-end="url(#arr)"/><rect class="inner" x="536" y="100" width="300" height="136" rx="14"/><circle cx="562" cy="128" r="13" fill="#E9B949"/><text x="562" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#08121F">2</text><text x="584" y="134" class="h">접수 검사</text><text x="556" y="168" class="s">24시간 3회, 같은 키는 기존 작업</text><text x="556" y="192" class="s">20MB 초과면 413</text><text x="556" y="216" class="s">빈 파일·zip·바이너리는 422</text><path class="line" d="M836,168 H850" marker-end="url(#arr)"/><rect class="inner" x="852" y="100" width="300" height="136" rx="14"/><circle cx="878" cy="128" r="13" fill="#E9B949"/><text x="878" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#08121F">3</text><text x="900" y="134" class="h">저장하고 202</text><text x="872" y="168" class="s">원본은 analysis_uploads</text><text x="872" y="192" class="s">작업은 VALIDATING</text><text x="872" y="216" class="s">이벤트 JSON은 바로 QUEUED</text><path class="line" d="M1002,236 V260 H370 V282" marker-end="url(#arr)"/><rect class="card" x="40" y="268" width="1120" height="168" rx="18"/><text x="64" y="304" class="h">검증 작업자</text><text x="64" y="326" class="s">1초마다</text><rect class="inner" x="220" y="284" width="300" height="136" rx="14"/><circle cx="246" cy="312" r="13" fill="#E9B949"/><text x="246" y="317" text-anchor="middle" font-size="14" font-weight="800" fill="#08121F">4</text><text x="268" y="318" class="h">원본 꺼내기</text><text x="240" y="352" class="s">가장 먼저 받은 원본 하나</text><text x="240" y="376" class="s">3번 넘게 죽으면 RETRY_EXHAUSTED</text><text x="240" y="400" class="s">24시간 넘으면 EXPIRED</text><path class="line" d="M520,352 H534" marker-end="url(#arr)"/><rect class="inner" x="536" y="284" width="300" height="136" rx="14"/><circle cx="562" cy="312" r="13" fill="#E9B949"/><text x="562" y="317" text-anchor="middle" font-size="14" font-weight="800" fill="#08121F">5</text><text x="584" y="318" class="h">파싱과 정규화</text><text x="556" y="352" class="s">카톡 TXT(PC·모바일), 인스타 JSON</text><text x="556" y="376" class="s">본인 메시지만 남긴다</text><text x="556" y="400" class="s">트랜잭션 밖에서 파싱</text><path class="line" d="M836,352 H850" marker-end="url(#arr)"/><rect class="inner" x="852" y="284" width="300" height="136" rx="14"/><circle cx="878" cy="312" r="13" fill="#E9B949"/><text x="878" y="317" text-anchor="middle" font-size="14" font-weight="800" fill="#08121F">6</text><text x="900" y="318" class="h">대기열로</text><text x="872" y="352" class="s">작업 QUEUED, 원본은 바로 지운다</text><text x="872" y="376" class="s">실패하면 UNSUPPORTED_FILE_FORMAT,</text><text x="872" y="400" class="s">SPEAKER_NOT_IDENTIFIED 등</text><path class="line" d="M1002,420 V444 H370 V466" marker-end="url(#arr)"/><rect class="card" x="40" y="452" width="1120" height="168" rx="18"/><text x="64" y="488" class="h">분석 작업자</text><text x="64" y="510" class="s">3초마다</text><rect class="inner" x="220" y="468" width="300" height="136" rx="14"/><circle cx="246" cy="496" r="13" fill="#E9B949"/><text x="246" y="501" text-anchor="middle" font-size="14" font-weight="800" fill="#08121F">7</text><text x="268" y="502" class="h">작업 임대</text><text x="240" y="536" class="s">임대 3분, 최대 3번 시도</text><text x="240" y="560" class="s">상태는 ANALYZING</text><text x="240" y="584" class="s">짧은 트랜잭션에서 잡는다</text><path class="line" d="M520,536 H534" marker-end="url(#arr)"/><rect class="inner" x="536" y="468" width="300" height="136" rx="14"/><circle cx="562" cy="496" r="13" fill="#E9B949"/><text x="562" y="501" text-anchor="middle" font-size="14" font-weight="800" fill="#08121F">8</text><text x="584" y="502" class="h">AI 채점</text><text x="556" y="536" class="s">최신 score 프롬프트 판을 읽는다</text><text x="556" y="560" class="s">Gemini 3.5 Flash-Lite, GenAI</text><text x="556" y="584" class="s">점수 범위와 근거 번호를 검증</text><path class="line" d="M836,536 H850" marker-end="url(#arr)"/><rect class="inner" x="852" y="468" width="300" height="136" rx="14"/><circle cx="878" cy="496" r="13" fill="#E9B949"/><text x="878" y="501" text-anchor="middle" font-size="14" font-weight="800" fill="#08121F">9</text><text x="900" y="502" class="h">한 트랜잭션으로 완료</text><text x="872" y="536" class="s">평가 저장(prompt_version 포함)</text><text x="872" y="560" class="s">작업 SUCCEEDED, 순위 재계산</text><text x="872" y="584" class="s">하나라도 실패하면 롤백</text><rect class="card" x="40" y="640" width="1120" height="150" rx="18"/><text x="64" y="676" class="h">클라이언트 폴링</text><text x="1136" y="676" class="code" text-anchor="end">GET /v1/analyses/{id}, 재방문은 GET /v1/me/analysis</text><rect class="inner" x="64" y="696" width="169" height="64" rx="12" stroke="#B4C4D8"/><text x="148" y="724" text-anchor="middle" style="font-family: ui-monospace, 'SF Mono', 'D2Coding', Consolas, 'Liberation Mono', monospace;" font-size="14" font-weight="700" fill="#B4C4D8">VALIDATING</text><text x="148" y="746" class="s" text-anchor="middle">파일만</text><path class="line" d="M233,728 H243" marker-end="url(#arr)"/><rect class="inner" x="245" y="696" width="169" height="64" rx="12" stroke="#B4C4D8"/><text x="329" y="724" text-anchor="middle" style="font-family: ui-monospace, 'SF Mono', 'D2Coding', Consolas, 'Liberation Mono', monospace;" font-size="14" font-weight="700" fill="#B4C4D8">QUEUED</text><path class="line" d="M413,728 H423" marker-end="url(#arr)"/><rect class="inner" x="425" y="696" width="169" height="64" rx="12" stroke="#8ECDF5"/><text x="510" y="724" text-anchor="middle" style="font-family: ui-monospace, 'SF Mono', 'D2Coding', Consolas, 'Liberation Mono', monospace;" font-size="14" font-weight="700" fill="#8ECDF5">ANALYZING</text><path class="line" d="M594,728 H604" marker-end="url(#arr)"/><rect class="inner" x="606" y="696" width="169" height="64" rx="12" stroke="#F7DE9F"/><text x="690" y="724" text-anchor="middle" style="font-family: ui-monospace, 'SF Mono', 'D2Coding', Consolas, 'Liberation Mono', monospace;" font-size="14" font-weight="700" fill="#F7DE9F">RANKING_PENDING</text><text x="690" y="746" class="s" text-anchor="middle">순위 반영 전</text><path class="line" d="M775,728 H785" marker-end="url(#arr)"/><rect class="inner" x="787" y="696" width="169" height="64" rx="12" stroke="#4CC38A"/><text x="871" y="724" text-anchor="middle" style="font-family: ui-monospace, 'SF Mono', 'D2Coding', Consolas, 'Liberation Mono', monospace;" font-size="14" font-weight="700" fill="#4CC38A">SUCCEEDED</text><text x="871" y="746" class="s" text-anchor="middle">다음은 /v1/me/result</text><rect class="inner" x="967" y="696" width="169" height="64" rx="12" stroke="#FF7A93"/><text x="1052" y="724" text-anchor="middle" style="font-family: ui-monospace, 'SF Mono', 'D2Coding', Consolas, 'Liberation Mono', monospace;" font-size="14" font-weight="700" fill="#FF7A93">FAILED</text><text x="1052" y="746" class="s" text-anchor="middle">error_code로 구분</text><text x="40" y="830" class="s">24시간 넘게 기다린 VALIDATING·QUEUED 작업은 AI가 꺼져 있어도 EXPIRED로 끝난다. 다시 하려면 새 요청을 보낸다.</text>
</svg>
