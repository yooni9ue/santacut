  <text x="1160" y="48" text-anchor="end" font-size="16" fill="#B4C4D8">자동 검사를 먼저, 사람 리뷰는 그다음</text><rect class="card" x="40" y="88" width="259" height="210" rx="16"/><circle cx="72" cy="124" r="15" fill="#E9B949"/><text x="72" y="129" text-anchor="middle" font-size="15" font-weight="800" fill="#08121F">1</text><text x="98" y="130" class="code" font-size="16" font-weight="700">gradlew check</text><text x="64" y="178" class="s">단위·통합 테스트 498개</text><text x="64" y="206" class="s">bootJar 빌드</text><text x="64" y="234" class="s">커밋 전에 꼭 돌린다</text><path class="line" d="M301,193 H323" marker-end="url(#arr)"/><rect class="card" x="327" y="88" width="259" height="210" rx="16"/><circle cx="359" cy="124" r="15" fill="#E9B949"/><text x="359" y="129" text-anchor="middle" font-size="15" font-weight="800" fill="#08121F">2</text><text x="385" y="130" class="h">구조 테스트</text><text x="351" y="178" class="s">ArchUnit 계층 의존</text><text x="351" y="206" class="s">파일마다 최상위 타입 1개</text><text x="351" y="234" class="s">어기면 check가 실패한다</text><path class="line" d="M588,193 H610" marker-end="url(#arr)"/><rect class="card" x="614" y="88" width="259" height="210" rx="16"/><circle cx="646" cy="124" r="15" fill="#E9B949"/><text x="646" y="129" text-anchor="middle" font-size="15" font-weight="800" fill="#08121F">3</text><text x="672" y="130" class="h">컨벤션 확인 명령</text><text x="638" y="178" class="s">문서에 적힌 find·grep</text><text x="638" y="206" class="s">금지 이름·패키지 검출</text><text x="638" y="234" class="s">결과를 리뷰 근거로 쓴다</text><path class="line" d="M875,193 H897" marker-end="url(#arr)"/><rect class="card" x="901" y="88" width="259" height="210" rx="16"/><circle cx="933" cy="124" r="15" fill="#E9B949"/><text x="933" y="129" text-anchor="middle" font-size="15" font-weight="800" fill="#08121F">4</text><text x="959" y="130" class="h">9인 리뷰 패널</text><text x="925" y="178" class="s">클린 코드, 객체지향, Spring</text><text x="925" y="206" class="s">분야마다 3명이 따로 판정</text><text x="925" y="234" class="s">API 계약 회귀는 치명</text><rect class="inner" x="40" y="316" width="1120" height="44" rx="12"/><text x="60" y="344" class="s">계약 기준: OpenAPI 명세(/v3/api-docs)와 프론트엔드 API 연동 가이드. 9명 모두 통과할 때까지 고친다.</text>
</svg>
