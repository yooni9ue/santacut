<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="품질 게이트">
  <title>품질 게이트</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1426"/><stop offset="1" stop-color="#0F1F33"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8FB4D9"/>
    </marker>
    <style>
      text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #E6EDF7; }
      .t { font-size: 24px; font-weight: 800; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 14px; fill: #A9BAD3; }
      .card { fill: #16233B; stroke: #2A3B5A; stroke-width: 1.5; }
      .line { stroke: #8FB4D9; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text class="t" x="40" y="54">품질 게이트</text>
  <text class="s" x="40" y="80">자동 검사를 먼저 통과한다. 그다음 9인 리뷰를 받는다.</text>

  <!-- 1 -->
  <rect class="card" x="40" y="110" width="250" height="250" rx="16"/>
  <rect x="40" y="110" width="250" height="6" rx="3" fill="#3E8BFF"/>
  <rect x="62" y="138" width="34" height="34" rx="6" fill="none" stroke="#3E8BFF" stroke-width="3"/>
  <path d="M70,155 l6,6 l12,-12" fill="none" stroke="#3E8BFF" stroke-width="3"/>
  <text class="h" x="62" y="206">gradlew check</text>
  <text class="s" x="62" y="236">단위·통합 테스트</text>
  <text class="s" x="62" y="260">bootJar 빌드</text>
  <text class="s" x="62" y="284">커밋 전 필수</text>
  <path class="line" d="M290,235 H318" marker-end="url(#arr)"/>

  <!-- 2 -->
  <rect class="card" x="322" y="110" width="250" height="250" rx="16"/>
  <rect x="322" y="110" width="250" height="6" rx="3" fill="#3DDC97"/>
  <rect x="344" y="138" width="34" height="10" rx="3" fill="#3DDC97"/>
  <rect x="344" y="151" width="34" height="10" rx="3" fill="#3DDC97" fill-opacity="0.7"/>
  <rect x="344" y="164" width="34" height="10" rx="3" fill="#3DDC97" fill-opacity="0.4"/>
  <text class="h" x="344" y="206">구조 테스트</text>
  <text class="s" x="344" y="236">ArchUnit 계층 의존</text>
  <text class="s" x="344" y="260">파일당 최상위 타입 1개</text>
  <text class="s" x="344" y="284">테스트로 자동 실패</text>
  <path class="line" d="M572,235 H600" marker-end="url(#arr)"/>

  <!-- 3 -->
  <rect class="card" x="604" y="110" width="250" height="250" rx="16"/>
  <rect x="604" y="110" width="250" height="6" rx="3" fill="#F5B83D"/>
  <circle cx="638" cy="153" r="13" fill="none" stroke="#F5B83D" stroke-width="3"/>
  <path d="M647,163 l10,10" stroke="#F5B83D" stroke-width="4"/>
  <text class="h" x="626" y="206">컨벤션 확인 명령</text>
  <text class="s" x="626" y="236">문서의 find·grep 실행</text>
  <text class="s" x="626" y="260">금지 이름·패키지 검출</text>
  <text class="s" x="626" y="284">결과를 리뷰 근거로 쓴다</text>
  <path class="line" d="M854,235 H882" marker-end="url(#arr)"/>

  <!-- 4 -->
  <rect class="card" x="886" y="110" width="274" height="250" rx="16"/>
  <rect x="886" y="110" width="274" height="6" rx="3" fill="#FF5A5F"/>
  <g fill="#FF5A5F">
    <circle cx="914" cy="146" r="6"/><circle cx="932" cy="146" r="6"/><circle cx="950" cy="146" r="6"/>
    <circle cx="914" cy="164" r="6" fill-opacity="0.7"/><circle cx="932" cy="164" r="6" fill-opacity="0.7"/><circle cx="950" cy="164" r="6" fill-opacity="0.7"/>
    <circle cx="914" cy="182" r="6" fill-opacity="0.4"/><circle cx="932" cy="182" r="6" fill-opacity="0.4"/><circle cx="950" cy="182" r="6" fill-opacity="0.4"/>
  </g>
  <text class="h" x="908" y="220">9인 리뷰 패널</text>
  <text class="s" x="908" y="248">클린 코드 · 객체지향 · Spring</text>
  <text class="s" x="908" y="272">각 3명, 서로 독립 판정</text>
  <text class="s" x="908" y="296">API 계약 회귀는 치명</text>
  <text class="s" x="908" y="320">9명 모두 100점까지 반복</text>
  <text class="s" x="40" y="396">계약 기준: OpenAPI 명세(/v3/api-docs)와 프론트엔드 API 연동 가이드</text>
</svg>
