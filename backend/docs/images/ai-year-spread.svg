<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="분석 기간과 대화문 고르기: 전에는 최근 90일을 최신순으로 2,000개까지 써서, 많이 쓰는 대화는 최근 몇 주만 남았다. 지금은 올해 1월 1일부터 달마다 같은 몫을 고르고, 모자란 달의 남는 몫은 다른 달로 넘긴다. 상대 말은 150자, 내 말은 300자까지 보낸다. 본인 2,000개, 전체 6,000개, 200,000자로 고른 뒤 AI 대화문은 52,000자, 최대 8구간이다">
  <title>분석 기간과 대화문 고르기: 전에는 최근 90일을 최신순으로 2,000개까지 써서, 많이 쓰는 대화는 최근 몇 주만 남았다. 지금은 올해 1월 1일부터 달마다 같은 몫을 고르고, 모자란 달의 남는 몫은 다른 달로 넘긴다. 상대 말은 150자, 내 말은 300자까지 보낸다. 본인 2,000개, 전체 6,000개, 200,000자로 고른 뒤 AI 대화문은 52,000자, 최대 8구간이다</title>
