  <text x="636" y="350" font-size="13" fill="#F5F8FC">대화가 적은 달(2월)이 남긴 몫은 다른 달로 간다.</text>
  <text x="636" y="372" font-size="13" fill="#F5F8FC">한 달 안에서는 가장 최근의 이어진 대화를 남긴다</text>

