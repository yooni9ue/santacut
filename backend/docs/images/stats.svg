<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="한눈에 보기: 핵심 숫자와 설계 선택">
  <title>한눈에 보기</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1426"/><stop offset="1" stop-color="#0F1F33"/>
    </linearGradient>
    <style>
      text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif; fill: #E6EDF7; }
      .t { font-size: 24px; font-weight: 800; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 14px; fill: #A9BAD3; }
      .xs { font-size: 12px; fill: #A9BAD3; }
      .m { font-family: 'JetBrains Mono', 'D2Coding', Consolas, 'Courier New', monospace; }
      .card { fill: #16233B; stroke: #2A3B5A; stroke-width: 1.5; }
      .cell { fill: #1D2D49; stroke: #33476B; stroke-width: 1; }
      .big { font-size: 46px; font-weight: 800; letter-spacing: -1px; }
      .unit { font-size: 18px; font-weight: 700; fill: #A9BAD3; }
      .lb { font-size: 15px; font-weight: 700; }
      .mid { font-size: 30px; font-weight: 800; }
    </style>
  </defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <text class="t" x="40" y="54">한눈에 보기</text>
  <text class="s" x="40" y="80">코드와 설정에서 센 숫자다.</text>
  <rect class="card" x="40" y="110" width="265" height="150" rx="16"/>
  <rect x="62" y="132" width="34" height="5" rx="2.5" fill="#3E8BFF"/>
  <text class="big" x="62" y="194" style="fill:#3E8BFF">12<tspan class="unit" dx="6">개</tspan></text>
  <text class="lb" x="62" y="224">HTTP 엔드포인트</text>
  <text class="xs" x="62" y="244">컨트롤러 7개</text>
  <rect class="card" x="325" y="110" width="265" height="150" rx="16"/>
  <rect x="347" y="132" width="34" height="5" rx="2.5" fill="#3DDC97"/>
  <text class="big" x="347" y="194" style="fill:#3DDC97">8<tspan class="unit" dx="6">개</tspan></text>
  <text class="lb" x="347" y="224">SQLite 테이블</text>
  <text class="xs" x="347" y="244">schema.sql 하나</text>
  <rect class="card" x="610" y="110" width="265" height="150" rx="16"/>
  <rect x="632" y="132" width="34" height="5" rx="2.5" fill="#7F52FF"/>
  <text class="big" x="632" y="194" style="fill:#7F52FF">4×5<tspan class="unit" dx="6"></tspan></text>
  <text class="lb" x="632" y="224">계층 × 도메인</text>
  <text class="xs" x="632" y="244">+ global 패키지</text>
  <rect class="card" x="895" y="110" width="265" height="150" rx="16"/>
  <rect x="917" y="132" width="34" height="5" rx="2.5" fill="#FF5A5F"/>
  <text class="big" x="917" y="194" style="fill:#FF5A5F">3<tspan class="unit" dx="6">회/일</tspan></text>
  <text class="lb" x="917" y="224">참가자당 분석 요청</text>
  <text class="xs" x="917" y="244">초과 시 거절</text>
  <rect class="card" x="40" y="280" width="265" height="150" rx="16"/>
  <rect x="62" y="302" width="34" height="5" rx="2.5" fill="#F5B83D"/>
  <text class="big" x="62" y="364" style="fill:#F5B83D">100<tspan class="unit" dx="6">회/일</tspan></text>
  <text class="lb" x="62" y="394">AI 호출 예산</text>
  <text class="xs" x="62" y="414">기본값 · 설정 가능</text>
  <rect class="card" x="325" y="280" width="265" height="150" rx="16"/>
  <rect x="347" y="302" width="34" height="5" rx="2.5" fill="#8FB4D9"/>
  <text class="big" x="347" y="364" style="fill:#8FB4D9">9<tspan class="unit" dx="6">명</tspan></text>
  <text class="lb" x="347" y="394">리뷰 패널</text>
  <text class="xs" x="347" y="414">독립 판정</text>
  <rect class="card" x="610" y="280" width="550" height="150" rx="16"/>
  <text class="lb" x="632" y="314">시간 설정</text>
  <rect class="cell" x="632.0" y="330" width="160.7" height="82" rx="12"/>
  <text class="mid" x="648.0" y="374" style="fill:#3DDC97">3<tspan class="unit" dx="4">초</tspan></text>
  <text class="xs" x="648.0" y="398">워커 큐 확인</text>
  <rect class="cell" x="804.7" y="330" width="160.7" height="82" rx="12"/>
  <text class="mid" x="820.7" y="374" style="fill:#3E8BFF">1<tspan class="unit" dx="4">초</tspan></text>
  <text class="xs" x="820.7" y="398">SSE 상태 전송</text>
  <rect class="cell" x="977.4" y="330" width="160.7" height="82" rx="12"/>
  <text class="mid" x="993.4" y="374" style="fill:#F5B83D">3<tspan class="unit" dx="4">분</tspan></text>
  <text class="xs" x="993.4" y="398">작업 임대</text>
  <text class="h" x="40" y="472">설계 선택</text>
  <rect class="card" x="40.0" y="488" width="173" height="80" rx="14"/>
  <circle cx="60.0" cy="515" r="5" fill="#3DDC97"/>
  <text class="lb" x="74.0" y="520" style="font-size:14.5px">SQLite 파일 DB</text>
  <text class="xs" x="56.0" y="548">서버 한 대면 충분</text>
  <rect class="card" x="229.4" y="488" width="173" height="80" rx="14"/>
  <circle cx="249.4" cy="515" r="5" fill="#F5B83D"/>
  <text class="lb" x="263.4" y="520" style="font-size:14.5px">DB 테이블 큐</text>
  <text class="xs" x="245.4" y="548">브로커가 필요 없다</text>
  <rect class="card" x="418.8" y="488" width="173" height="80" rx="14"/>
  <circle cx="438.8" cy="515" r="5" fill="#FF5A5F"/>
  <text class="lb" x="452.8" y="520" style="font-size:14.5px">작업 임대 3분</text>
  <text class="xs" x="434.8" y="548">워커가 죽어도 복구</text>
  <rect class="card" x="608.2" y="488" width="173" height="80" rx="14"/>
  <circle cx="628.2" cy="515" r="5" fill="#3E8BFF"/>
  <text class="lb" x="642.2" y="520" style="font-size:14.5px">202 + SSE</text>
  <text class="xs" x="624.2" y="548">느린 AI가 안 막는다</text>
  <rect class="card" x="797.6" y="488" width="173" height="80" rx="14"/>
  <circle cx="817.6" cy="515" r="5" fill="#7F52FF"/>
  <text class="lb" x="831.6" y="520" style="font-size:14.5px">Spring AI</text>
  <text class="xs" x="813.6" y="548">설정으로 제공자 교체</text>
  <rect class="card" x="987.0" y="488" width="173" height="80" rx="14"/>
  <circle cx="1007.0" cy="515" r="5" fill="#8FB4D9"/>
  <text class="lb" x="1021.0" y="520" style="font-size:14.5px">4계층 레이어드</text>
  <text class="xs" x="1003.0" y="548">포트·어댑터 없음</text>
</svg>
