  <text x="82" y="48" font-size="28" font-weight="800">한눈에 보기</text>
  <text x="1160" y="48" text-anchor="end" font-size="16" fill="#B4C4D8">코드와 테스트 결과에서 센 숫자</text><use href="#flake" xlink:href="#flake" x="1150" y="78" width="16" height="16" stroke="#F5F8FC" opacity="0.35"/><rect class="card" x="40" y="84" width="363" height="112" rx="16"/><text x="64" y="140" font-size="40" font-weight="800" fill="#F7DE9F">18</text><text x="113" y="140" font-size="18" font-weight="700" fill="#F7DE9F">개</text><text x="64" y="168" class="h">HTTP 엔드포인트</text><text x="64" y="186" class="s">OpenAPI 기준. dev 전용 3개는 따로</text><rect class="card" x="419" y="84" width="363" height="112" rx="16"/><text x="443" y="140" font-size="40" font-weight="800" fill="#F7DE9F">10</text><text x="492" y="140" font-size="18" font-weight="700" fill="#F7DE9F">개</text><text x="443" y="168" class="h">SQLite 테이블</text><text x="443" y="186" class="s">schema.sql 하나</text><rect class="card" x="797" y="84" width="363" height="112" rx="16"/><text x="821" y="140" font-size="40" font-weight="800" fill="#F7DE9F">392</text><text x="893" y="140" font-size="18" font-weight="700" fill="#F7DE9F">개</text><text x="821" y="168" class="h">자동 테스트</text><text x="821" y="186" class="s">gradlew check 통과</text><rect class="card" x="40" y="212" width="363" height="112" rx="16"/><text x="64" y="268" font-size="40" font-weight="800" fill="#F7DE9F">32</text><text x="113" y="268" font-size="18" font-weight="700" fill="#F7DE9F">개</text><text x="64" y="296" class="h">오류 코드</text><text x="64" y="314" class="s">ErrorCode.kt. 작업 실패 코드는 따로 8개</text><rect class="card" x="419" y="212" width="363" height="112" rx="16"/><text x="443" y="268" font-size="40" font-weight="800" fill="#F7DE9F">271</text><text x="514" y="268" font-size="18" font-weight="700" fill="#F7DE9F">개</text><text x="443" y="296" class="h">지역</text><text x="443" y="314" class="s">시·도 16 + 시·군·구 255</text><rect class="card" x="797" y="212" width="363" height="112" rx="16"/><text x="821" y="268" font-size="40" font-weight="800" fill="#F7DE9F">3</text><text x="848" y="268" font-size="18" font-weight="700" fill="#F7DE9F">회</text><text x="821" y="296" class="h">참가자당 24시간 제출</text><text x="821" y="314" class="s">AI 비용은 토큰 가드가 막는다</text><rect class="card" x="40" y="340" width="1120" height="96" rx="16"/><text x="64" y="394" class="h">시간 설정</text><rect class="inner" x="200" y="356" width="220" height="64" rx="12"/><text x="218" y="396" font-size="24" font-weight="800">1초</text><text x="262" y="395" class="s">검증 작업자 간격</text><rect class="inner" x="432" y="356" width="220" height="64" rx="12"/><text x="450" y="396" font-size="24" font-weight="800">3초</text><text x="494" y="395" class="s">분석 작업자 간격</text><rect class="inner" x="664" y="356" width="220" height="64" rx="12"/><text x="682" y="396" font-size="24" font-weight="800">3분</text><text x="726" y="395" class="s">작업 임대</text><rect class="inner" x="896" y="356" width="220" height="64" rx="12"/><text x="914" y="396" font-size="24" font-weight="800">24시간</text><text x="994" y="395" class="s">대기 작업 만료</text><text x="40" y="476" class="h">설계 선택</text><rect class="card" x="40" y="490" width="177" height="74" rx="14"/><text x="56" y="520" font-size="16" font-weight="700">SQLite 파일 DB</text><text x="56" y="544" class="s">서버 한 대면 충분하다</text><rect class="card" x="229" y="490" width="177" height="74" rx="14"/><text x="245" y="520" font-size="16" font-weight="700">DB 테이블 큐</text><text x="245" y="544" class="s">브로커가 필요 없다</text><rect class="card" x="417" y="490" width="177" height="74" rx="14"/><text x="433" y="520" font-size="16" font-weight="700">원본은 따로 저장</text><text x="433" y="544" class="s">검증 뒤 바로 지운다</text><rect class="card" x="606" y="490" width="177" height="74" rx="14"/><text x="622" y="520" font-size="16" font-weight="700">202 + 폴링·SSE</text><text x="622" y="544" class="s">느린 AI가 안 막는다</text><rect class="card" x="795" y="490" width="177" height="74" rx="14"/><text x="811" y="520" font-size="16" font-weight="700">판 단위 프롬프트</text><text x="811" y="544" class="s">늘 최신 판을 쓴다</text><rect class="card" x="983" y="490" width="177" height="74" rx="14"/><text x="999" y="520" font-size="16" font-weight="700">4계층 레이어드</text><text x="999" y="544" class="s">포트·어댑터 없음</text>
</svg>
