<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="요청 흐름: 클라이언트가 HTTPS(Caddy, Let's Encrypt 인증서, HSTS)를 거쳐 Lightsail micro_3_0(1GB) 위 Spring Boot 앱의 4계층(application은 흐름만 쓰는 facade와 실행 기법을 맡는 runner)으로 들어간다. 진행 상황은 SSE 스트림이나 폴링으로 받는다. 작업자 셋이 원본 검증(1초), AI 채점(3초, 동시 3개), 순위 모아 계산(30초)을 하고, SQLite에 저장하고, Gemini 3.5 Flash-Lite를 부른다. SQLite는 매시 KMS로 암호화한 S3로 백업한다. 앱은 공유 HTML과 PNG를 그린다">
  <title>요청 흐름: 클라이언트가 HTTPS(Caddy, Let's Encrypt 인증서, HSTS)를 거쳐 Lightsail micro_3_0(1GB) 위 Spring Boot 앱의 4계층(application은 흐름만 쓰는 facade와 실행 기법을 맡는 runner)으로 들어간다. 진행 상황은 SSE 스트림이나 폴링으로 받는다. 작업자 셋이 원본 검증(1초), AI 채점(3초, 동시 3개), 순위 모아 계산(30초)을 하고, SQLite에 저장하고, Gemini 3.5 Flash-Lite를 부른다. SQLite는 매시 KMS로 암호화한 S3로 백업한다. 앱은 공유 HTML과 PNG를 그린다</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1B2E"/><stop offset="0.62" stop-color="#0B1D2D"/><stop offset="1" stop-color="#0B2422"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4C4D8"/>
    </marker>
    <marker id="arrLater" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8DA3BE"/>
    </marker>
    <symbol id="flake" viewBox="-10 -10 20 20" overflow="visible"><g fill="none" stroke-width="1.3" stroke-linecap="round"><g transform="rotate(0)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g><g transform="rotate(60)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g><g transform="rotate(120)"><path d="M0,-9 V9"/><path d="M-2.6,-7.4 L0,-5 L2.6,-7.4"/><path d="M-2.6,7.4 L0,5 L2.6,7.4"/></g></g></symbol>
    
    <style>
      text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', system-ui, sans-serif; }
      text:not([fill]) { fill: #F5F8FC; }
      .card { fill: #12263F; stroke: #1E3A5C; stroke-width: 1.5; }
      .inner { fill: #183152; stroke: #2B4A70; stroke-width: 1; }
      .ghost { fill: #0C1B2E; stroke: #8DA3BE; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .dev { fill: #0E3328; stroke: #134236; stroke-width: 1.5; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 14px; fill: #B4C4D8; }
      .code { font-family: ui-monospace, 'SF Mono', 'D2Coding', Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #8ECDF5; }
      .line { stroke: #B4C4D8; stroke-width: 2; fill: none; }
      .later { stroke: #8DA3BE; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
      
    </style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <path d="M0,626 Q300,610 600,622 T1200,620 V626 A24,24 0 0 1 1176,650 H24 A24,24 0 0 1 0,626 z" fill="#F5F8FC" opacity="0.05"/>
  <g fill="#F5F8FC"><circle cx="579" cy="348" r="1.7" opacity="0.37"/><circle cx="638" cy="364" r="1.0" opacity="0.38"/><circle cx="770" cy="487" r="0.9" opacity="0.33"/><circle cx="188" cy="497" r="1.5" opacity="0.26"/><circle cx="1151" cy="589" r="1.5" opacity="0.4"/><circle cx="260" cy="23" r="1.3" opacity="0.26"/><circle cx="295" cy="158" r="0.8" opacity="0.37"/></g>
  <path d="M40,0 H64 V56 L52,47 L40,56 z" fill="#B5123E"/>
  <path d="M43.5,0 V50 M60.5,0 V50" stroke="#E9B949" stroke-width="1" opacity="0.75"/>
  <text x="82" y="48" font-size="28" font-weight="800">요청 흐름</text>
  <text x="1160" y="48" text-anchor="end" font-size="16" fill="#B4C4D8">동기 API, 작업 큐, SSE·폴링, 공유 렌더링</text><use href="#flake" xlink:href="#flake" x="1150" y="600" width="16" height="16" stroke="#F5F8FC" opacity="0.35"/><rect class="card" x="40" y="110" width="160" height="120" rx="16"/><text x="120" y="150" class="h" text-anchor="middle">클라이언트</text><text x="120" y="174" class="s" text-anchor="middle">웹 화면</text><text x="120" y="194" class="s" text-anchor="middle">공유 링크 크롤러</text><text x="120" y="214" class="s" text-anchor="middle">SSE 스트림 또는 폴링</text><path class="line" d="M200,170 H232" marker-end="url(#arr)"/><rect class="card" x="236" y="110" width="160" height="120" rx="16"/><text x="316" y="156" class="h" text-anchor="middle">Caddy</text><text x="316" y="180" class="s" text-anchor="middle">HTTPS :443, HSTS</text><text x="316" y="200" class="s" text-anchor="middle">/actuator는 404</text><rect class="card" x="236" y="246" width="160" height="62" rx="12"/><text x="316" y="272" class="h" text-anchor="middle">Let's Encrypt</text><text x="316" y="294" class="s" text-anchor="middle">HTTP는 HTTPS로 넘김</text><path class="line" d="M316,230 V242" marker-end="url(#arr)"/><path class="line" d="M396,170 H428" marker-end="url(#arr)"/><rect class="card" x="432" y="84" width="420" height="474" rx="18"/><text x="452" y="114" class="h">Spring Boot 앱</text><text x="834" y="114" class="s" text-anchor="end">Lightsail micro_3_0, 1GB</text><rect class="inner" x="452" y="132" width="380" height="66" rx="12"/><text x="470" y="160" class="code">presentation</text><text x="470" y="182" class="s">컨트롤러, 세션 필터, CSRF, Swagger</text><path class="line" d="M800,198 V208" marker-end="url(#arr)"/><rect class="inner" x="452" y="210" width="380" height="66" rx="12"/><text x="470" y="238" class="code">application</text><text x="470" y="260" class="s">facade는 흐름, runner는 스레드·잠금·트랜잭션</text><path class="line" d="M800,276 V286" marker-end="url(#arr)"/><rect class="inner" x="452" y="288" width="380" height="66" rx="12"/><text x="470" y="316" class="code">domain</text><text x="470" y="338" class="s">엔티티, 값 객체, 일급 컬렉션, service</text><path class="line" d="M800,354 V364" marker-end="url(#arr)"/><rect class="inner" x="452" y="366" width="380" height="66" rx="12"/><text x="470" y="394" class="code">infrastructure</text><text x="470" y="416" class="s">JPA 리포지토리, AI 클라이언트, 렌더러</text><rect class="inner" x="452" y="456" width="380" height="84" rx="12"/><text x="470" y="484" class="h">작업자 셋(@Scheduled)</text><text x="470" y="506" class="s">원본 검증 1초, AI 채점 3초(동시 3개)</text><text x="470" y="526" class="s">순위 모아 계산 30초, 작업 임대 7분</text><rect class="card" x="892" y="84" width="268" height="88" rx="16"/><text x="912" y="116" class="h">S3 백업</text><text x="912" y="138" class="s">매시 sqlite3 .backup</text><text x="912" y="158" class="s">버킷이 KMS로 암호화(SSE-KMS)</text><rect class="card" x="892" y="212" width="268" height="152" rx="16"/><g transform="translate(912,232)"><ellipse cx="11" cy="4" rx="11" ry="4" fill="#E9B949"/><path d="M0,4 V24 A11,4 0 0 0 22,24 V4" fill="#E9B949" fill-opacity="0.55"/></g><text x="944" y="252" class="h">SQLite 파일 DB</text><text x="912" y="290" class="s">커넥션 풀 1개</text><text x="912" y="312" class="s">테이블 13개, 작업 큐 포함</text><text x="912" y="334" class="s">채점 프롬프트 판(prompts)</text><path class="line" d="M1026,212 V176" marker-end="url(#arr)"/><text x="1036" y="198" class="s">매시</text><path class="line" d="M832,423 H860 V288 H888" marker-end="url(#arr)"/><rect class="card" x="892" y="440" width="268" height="118" rx="16" stroke="#8ECDF5"/><text x="912" y="472" class="h" fill="#8ECDF5">Google Gemini</text><text x="912" y="496" class="s">Gemini 3.5 Flash-Lite</text><text x="912" y="518" class="s">Spring AI 2.0.0, API 키</text><text x="912" y="540" class="s">비용 예약 가드, JSON 응답 스키마</text><path class="line" d="M832,498 H888" marker-end="url(#arr)"/><rect class="card" x="40" y="352" width="356" height="106" rx="16"/><text x="60" y="384" class="h">공유 페이지와 이미지</text><text x="60" y="408" class="code">/s/{token} HTML, image.png</text><text x="60" y="432" class="s">Open Graph 태그를 첫 응답에 넣는다</text><path class="line" d="M432,404 H400" marker-end="url(#arr)"/>
</svg>
