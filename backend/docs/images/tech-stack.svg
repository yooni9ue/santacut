<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="기술 스택과 버전">
  <title>기술 스택</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
