<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="원본 대화 내보내기에서 점수까지: 올해 1월 1일부터 본인 2,000개·전체 6,000개를 달마다 고르게 고르고, 이름을 나·상대로 바꾸고 간격 줄·링크·웃음·이모지·긴 글을 줄인 대화문을 약 6,700자씩 최대 8구간으로 나눠 Gemini 3.5 Flash-Lite에 보낸다. 답은 250토큰 이하 JSON이고, 코드가 3번 중앙값·구간 무게·수축으로 합쳐 점수·유형·배지를 만든다">
  <title>원본 대화 내보내기에서 점수까지: 올해 1월 1일부터 본인 2,000개·전체 6,000개를 달마다 고르게 고르고, 이름을 나·상대로 바꾸고 간격 줄·링크·웃음·이모지·긴 글을 줄인 대화문을 약 6,700자씩 최대 8구간으로 나눠 Gemini 3.5 Flash-Lite에 보낸다. 답은 250토큰 이하 JSON이고, 코드가 3번 중앙값·구간 무게·수축으로 합쳐 점수·유형·배지를 만든다</title>
